        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            style={{ flex: 1, padding: "12px 4px", border: "none", background: "none", cursor: "pointer", fontSize: 13, fontWeight: tab === t.id ? 700 : 400, color: tab === t.id ? "#1a1a2e" : "#6b6b80", borderBottom: tab === t.id ? "2.5px solid #1a1a2e" : "2.5px solid transparent" }}>
            {t.label}
          </button>
        ))}
      </div>
      {tab === "stats" && <GlobalStats events={events} />}
      {tab === "backup" && <BackupTab events={events} onImport={onImport} />}
      {tab === "planning" && <Planning candidatures={candidatures} onSaveCandidature={onSaveCandidature} onDeleteCandidature={onDeleteCandidature}/>}
      {tab === "events" && (
        <div style={{ padding: "1rem 1.1rem" }}>
          <button onClick={onCreate} style={{ width: "100%", padding: "14px", background: "#1a1a2e", color: "#fff", border: "none", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
            + Nouvel événement
          </button>
          {events.length === 0
            ? <div style={{ textAlign: "center", padding: "3rem 1rem", color: "#aaa" }}>
                <p style={{ fontSize: 40 }}>🎪</p>
                <p style={{ fontSize: 16, fontWeight: 600, color: "#6b6b80" }}>Aucun événement</p>
                <p style={{ fontSize: 13 }}>Crée ton premier événement pour commencer</p>
              </div>
            : [...events].sort((a, b) => new Date(b.dateStart || b.date) - new Date(a.dateStart || a.date)).map(ev => {
              const c = calcEvent(ev);
              return (
                <div key={ev.id} onClick={() => onSelect(ev.id)} style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: "13px 15px", marginBottom: 9, cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <p style={{ margin: 0, fontWeight: 700, fontSize: 15 }}>{ev.name}</p>
                      <p style={{ margin: "2px 0 7px", fontSize: 12, color: "#6b6b80" }}>
                        {ev.location && `${ev.location} · `}{dateRange(ev.dateStart || ev.date, ev.dateEnd)}
                      </p>
                      <div style={{ display: "flex", gap: 12 }}>
                        <span style={{ fontSize: 13 }}><span style={{ color: "#aaa" }}>Brut </span><strong style={{ color: "#1a6b3a" }}>{euro(c.gross)}</strong></span>
                        <span style={{ fontSize: 13 }}><span style={{ color: "#aaa" }}>Net </span><strong style={{ color: c.net >= 0 ? "#1a6b3a" : "#e05050" }}>{euro(c.net)}</strong></span>
                        <span style={{ fontSize: 13, color: "#aaa" }}>{c.count} ventes</span>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ fontSize: 17 }}>{c.net >= 0 ? "🟢" : "🔴"}</span>
                      <button onClick={e => { e.stopPropagation(); onEdit(ev.id); }} style={{ padding: "5px 9px", border: "1px solid #eee", borderRadius: 6, background: "none", cursor: "pointer", fontSize: 12 }}>✏️</button>
                    </div>
                  </div>
                </div>
              );
            })}
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const KEY = "convention_tracker_v1";
  const PROD_KEY = "convention_products_v1";
  const CAND_KEY = "convention_candidatures_v1";

  const [events, setEvents] = useState(() => {
    try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : []; } catch { return []; }
  });
  // Catalogue partagé entre tous les événements
  const [globalProducts, setGlobalProducts] = useState(() => {
    try { const s = localStorage.getItem(PROD_KEY); return s ? JSON.parse(s) : []; } catch { return []; }
  });

  const [selectedId, setSelectedId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(events)); } catch {} }, [events]);
  useEffect(() => { try { localStorage.setItem(PROD_KEY, JSON.stringify(globalProducts)); } catch {} }, [globalProducts]);

  const [candidatures, setCandidatures] = useState(() => {
    try { const s = localStorage.getItem(CAND_KEY); return s ? JSON.parse(s) : []; } catch { return []; }
  });
  useEffect(() => { try { localStorage.setItem(CAND_KEY, JSON.stringify(candidatures)); } catch {} }, [candidatures]);
  function saveCandidature(c) { setCandidatures(prev => { const ex = prev.find(e => e.id === c.id); return ex ? prev.map(e => e.id === c.id ? c : e) : [...prev, c]; }); }
  function deleteCandidature(id) { setCandidatures(prev => prev.filter(c => c.id !== id)); }

  function saveEvent(ev) {
    setEvents(prev => {
      const ex = prev.find(e => e.id === ev.id);
      return ex ? prev.map(e => e.id === ev.id ? ev : e) : [...prev, ev];
    });
  }

  // updateEvent injecte toujours le catalogue global dans l'événement avant de sauvegarder
  function updateEvent(ev) {
    setEvents(prev => prev.map(e => e.id === ev.id ? ev : e));
    // Si les produits de l'événement ont été modifiés, on met à jour le catalogue global
    if (ev.products) {
      setGlobalProducts(prev => {
        let updated = [...prev];
        ev.products.forEach(p => {
          const idx = updated.findIndex(g => g.id === p.id);
          if (idx >= 0) { updated[idx] = { ...p, stock: updated[idx].stock }; } // stock global inchangé
          else updated.push(p);
        });
        return updated;
      });
    }
  }

  function doImport(data) {
    if (confirm(`Importer ${data.length} événement(s) ? Cela remplace tout.`)) {
      setEvents(data);
      // Reconstruire le catalogue global depuis les données importées
      const allProds = {};
      data.forEach(ev => (ev.products || []).forEach(p => { allProds[p.id] = p; }));
      setGlobalProducts(Object.values(allProds));
    }
  }

  const selected = events.find(e => e.id === selectedId);
  const editEv = events.find(e => e.id === editId);

  // Injecter le catalogue global dans l'événement sélectionné si ses produits sont vides
  const selectedWithProducts = selected
    ? { ...selected, products: selected.products?.length > 0 ? selected.products : globalProducts.map(p => ({ ...p, stock: p.stock || 0 })) }
    : null;

  if (selectedWithProducts) return <EventDetail event={selectedWithProducts} onUpdate={updateEvent} onBack={() => setSelectedId(null)} globalProducts={globalProducts} onUpdateGlobalProducts={setGlobalProducts} />;

  return (
    <>
      <EventsList
        events={events}
        onSelect={id => setSelectedId(id)}
        onCreate={() => { setEditId(null); setShowForm(true); }}
        onEdit={id => { setEditId(id); setShowForm(true); }}
        onImport={doImport}
        onSaveCandidature={saveCandidature}
        onDeleteCandidature={deleteCandidature}
      />
      {showForm && (
        <Sheet title={editId ? "Modifier l'événement" : "Nouvel événement"} onClose={() => { setShowForm(false); setEditId(null); }}>
          <EventForm existing={editEv || null} onSave={saveEvent} onClose={() => { setShowForm(false); setEditId(null); }} />
        </Sheet>
      )}
    </>
  );
}
// ── HISTORIC FORM ────────────────────────────────────────────────────────────
function HistoricForm({ onSave, onClose }) {
  const [name, setName] = useState("");
  const [ds, setDs] = useState("");
  const [de, setDe] = useState("");
  const [loc, setLoc] = useState("");
  const [grossTotal, setGrossTotal] = useState("");
  const [costs, setCosts] = useState({ ticket: "", airbnb: "", transport: "", other: "" });
  const [products, setProducts] = useState([{ id: genId(), name: "", price: "", costPrice: "", manga: "", category: "Moyen" }]);

  const fixed = Object.values(costs).reduce((t, v) => t + (parseFloat(v) || 0), 0);
  const gross = parseFloat(grossTotal) || 0;
  const cogs = products.filter(p => p.name && parseFloat(p.costPrice) > 0).reduce((t, p) => t + (parseFloat(p.costPrice) || 0), 0);
  const net = gross - fixed - cogs;
  const rentab = gross > 0 ? ((net / gross) * 100).toFixed(1) : null;
  const margins = products.filter(p => parseFloat(p.price) > 0 && parseFloat(p.costPrice) >= 0);
  const avgMarg = margins.length > 0
    ? (margins.reduce((t, p) => { const pr = parseFloat(p.price), co = parseFloat(p.costPrice) || 0; return t + ((pr - co) / pr) * 100; }, 0) / margins.length).toFixed(1)
    : null;

  function addProd() { setProducts(p => [...p, { id: genId(), name: "", price: "", costPrice: "", manga: "", category: "Moyen" }]); }
  function delProd(id) { setProducts(p => p.filter(x => x.id !== id)); }
  function updProd(id, k, v) { setProducts(p => p.map(x => x.id === id ? { ...x, [k]: v } : x)); }
  const ci = k => v => setCosts(c => ({ ...c, [k]: v }));

  function save() {
    if (!name.trim()) { alert("Nom requis"); return; }
    if (!ds) { alert("Date requise"); return; }
    if (!grossTotal) { alert("Saisis au moins le CA brut total"); return; }
    const builtProds = products.filter(p => p.name.trim() && parseFloat(p.price) > 0).map(p => ({
      id: p.id, name: p.name.trim(), category: p.category, manga: p.manga.trim(),
      price: parseFloat(p.price), costPrice: parseFloat(p.costPrice) || 0, stock: 0, photo: null, isPack: false, packItems: "", sortOrder: 999
    }));
    const sales = [{ id: genId(), items: [{ productId: "hist-" + genId(), name: "Ventes totales", price: gross, qty: 1, photo: null }],
      cartTotal: gross, discount: 0, isDonation: false, paymentMethod: "especes", total: gross,
      timestamp: new Date(ds).getTime(), isHistoric: true }];
    onSave({ id: genId(), name: name.trim(), dateStart: ds, dateEnd: de || ds, location: loc,
      costs, totalCosts: fixed, products: builtProds, sales, eventPhotos: [], createdAt: Date.now(), isHistoric: true });
    onClose();
  }

  return (<>
    <div style={{ background: "#fff8e8", border: "1px solid #f2d98a", borderRadius: 10, padding: "10px 14px", marginBottom: 14, fontSize: 13, color: "#856404" }}>
      📅 Mode historique — Saisis le CA total, les frais, et les produits si tu les as
    </div>
    <Row label="Nom de la convention"><Inp value={name} onChange={setName} placeholder="Epitanime 2023…"/></Row>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
      <Row label="Début"><Inp type="date" value={ds} onChange={setDs}/></Row>
      <Row label="Fin (optionnel)"><Inp type="date" value={de} onChange={setDe}/></Row>
    </div>
    <Row label="Lieu (optionnel)"><Inp value={loc} onChange={setLoc} placeholder="Paris…"/></Row>
    <div style={{ background: "#f0faf4", border: "1px solid #8dd4a0", borderRadius: 10, padding: "1rem", marginBottom: 14 }}>
      <p style={{ margin: "0 0 8px", fontWeight: 700, fontSize: 12, color: "#1a6b3a", textTransform: "uppercase" }}>💰 CA brut total encaissé *</p>
      <Row label="Montant total (€)"><Inp type="number" value={grossTotal} onChange={setGrossTotal} placeholder="ex: 1500" min="0"/></Row>
    </div>
    <details style={{ marginBottom: 14 }}>
      <summary style={{ cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#6b6b80", padding: "8px 0", userSelect: "none" }}>
        💸 Frais (optionnel) {fixed > 0 && `· ${euro(fixed)}`}
      </summary>
      <div style={{ background: "#f8f8fc", borderRadius: 10, padding: "1rem", marginTop: 8 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Row label="Stand/billet (€)"><Inp type="number" value={costs.ticket} onChange={ci("ticket")} placeholder="0" min="0"/></Row>
          <Row label="Airbnb (€)"><Inp type="number" value={costs.airbnb} onChange={ci("airbnb")} placeholder="0" min="0"/></Row>
          <Row label="Transport (€)"><Inp type="number" value={costs.transport} onChange={ci("transport")} placeholder="0" min="0"/></Row>
          <Row label="Autres (€)"><Inp type="number" value={costs.other} onChange={ci("other")} placeholder="0" min="0"/></Row>
        </div>
      </div>
    </details>
    <details style={{ marginBottom: 14 }}>
      <summary style={{ cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#6b6b80", padding: "8px 0", userSelect: "none" }}>
        📦 Produits vendus (optionnel — pour calcul de marge)
      </summary>
      <div style={{ marginTop: 8 }}>
        {products.map((p, idx) => (
          <div key={p.id} style={{ background: "#f8f8fc", borderRadius: 10, padding: "10px 12px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: "#6b6b80" }}>Produit {idx + 1}</span>
              {products.length > 1 && <button onClick={() => delProd(p.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "#e05050", fontSize: 16 }}>✕</button>}
            </div>
            <Row label="Nom du produit"><Inp value={p.name} onChange={v => updProd(p.id, "name", v)} placeholder="Miroir Naruto Géant…"/></Row>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <Row label="Manga"><Inp value={p.manga} onChange={v => updProd(p.id, "manga", v)} placeholder="Naruto…"/></Row>
              <Row label="Catégorie">
                <select value={p.category} onChange={e => updProd(p.id, "category", e.target.value)}
                  style={{ width: "100%", padding: "10px 12px", border: "1px solid #e0e0e8", borderRadius: 8, fontSize: 14, background: "#fff" }}>
                  {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                </select>
              </Row>
              <Row label="Prix vente (€)"><Inp type="number" value={p.price} onChange={v => updProd(p.id, "price", v)} placeholder="35" min="0" step="0.5"/></Row>
              <Row label="Coût revient (€)"><Inp type="number" value={p.costPrice} onChange={v => updProd(p.id, "costPrice", v)} placeholder="12" min="0" step="0.5"/></Row>
            </div>
            {parseFloat(p.price) > 0 && parseFloat(p.costPrice) >= 0 && (
              <div style={{ marginTop: 6, fontSize: 11, color: "#6b6b80", display: "flex", gap: 10 }}>
                <span>Marge : <strong style={{ color: "#1a6b3a" }}>{euro(parseFloat(p.price) - (parseFloat(p.costPrice) || 0))}</strong></span>
                <span>({(((parseFloat(p.price) - (parseFloat(p.costPrice) || 0)) / parseFloat(p.price)) * 100).toFixed(0)}%)</span>
              </div>
            )}
          </div>
        ))}
        <button onClick={addProd} style={{ width: "100%", padding: "9px", border: "1px dashed #ccc", borderRadius: 10, background: "none", cursor: "pointer", fontSize: 13, color: "#6b6b80", fontWeight: 600 }}>
          + Ajouter un produit
        </button>
      </div>
    </details>
    {gross > 0 && (
      <div style={{ background: "#1a1a2e", borderRadius: 12, padding: "1rem", marginBottom: 14, color: "#fff" }}>
        <p style={{ margin: "0 0 10px", fontSize: 11, color: "rgba(255,255,255,0.5)", textTransform: "uppercase" }}>Récap estimé</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
          <div style={{ background: "rgba(111,207,151,0.15)", borderRadius: 8, padding: "8px 10px" }}>
            <p style={{ margin: 0, fontSize: 9, color: "rgba(255,255,255,0.45)", textTransform: "uppercase" }}>CA brut</p>
            <p style={{ margin: "3px 0 0", fontWeight: 900, fontSize: 20, color: "#6fcf97" }}>{euro(gross)}</p>
          </div>
          <div style={{ background: net >= 0 ? "rgba(111,207,151,0.15)" : "rgba(235,87,87,0.15)", borderRadius: 8, padding: "8px 10px" }}>
            <p style={{ margin: 0, fontSize: 9, color: "rgba(255,255,255,0.45)", textTransform: "uppercase" }}>Net estimé</p>
            <p style={{ margin: "3px 0 0", fontWeight: 900, fontSize: 20, color: net >= 0 ? "#6fcf97" : "#eb5757" }}>{euro(net)}</p>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, paddingTop: 10, borderTop: "1px solid rgba(255,255,255,0.1)" }}>
          <div><p style={{ margin: 0, fontSize: 9, color: "rgba(255,255,255,0.4)" }}>Frais</p><p style={{ margin: "2px 0 0", fontWeight: 700, fontSize: 13, color: "#eb5757" }}>{euro(fixed)}</p></div>
          <div><p style={{ margin: 0, fontSize: 9, color: "rgba(255,255,255,0.4)" }}>Rentabilité</p><p style={{ margin: "2px 0 0", fontWeight: 800, fontSize: 15, color: rentab >= 0 ? "#6fcf97" : "#eb5757" }}>{rentab !== null ? `${rentab}%` : "—"}</p></div>
          <div><p style={{ margin: 0, fontSize: 9, color: "rgba(255,255,255,0.4)" }}>Marge moy.</p><p style={{ margin: "2px 0 0", fontWeight: 800, fontSize: 15, color: "#f2994a" }}>{avgMarg !== null ? `${avgMarg}%` : "—"}</p></div>
        </div>
      </div>
    )}
    <button onClick={save} style={{ width: "100%", padding: "13px", background: "#1a1a2e", color: "#fff", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
      Enregistrer l'historique
    </button>
  </>);
}




const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
